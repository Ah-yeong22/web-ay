<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <style>
        body {
            background-color: #f5f5f5;
            font-family: Arial;
        }

        h1 {
            color: navy;
            font-size: 30px;
        }

        .student{
            border: 2px solid black;
        }

        table {
            border: 2px solid black;
        }

        th, td {
            border: 1px solid gray;
        }

        th {
            background-color: #dddddd;
        }
    </style>
</head>
<body>

    <h1>수강생 관리 화면</h1>

    <div class="student">
        <h2>수강생 등록</h2>

        <p>이름 : </p>
       

        <p>과정 선택</p>
        <select>
            <option>HTML 기초</option>
            <option>CSS 기초</option>
            <option>화면 설계</option>
        </select>

        <input type="button" value="등록">
    </div>

    <h2>수강생 목록</h2>

    <table>
        <tr>
            <th>번호</th>
            <th>이름</th>
            <th>과정명</th>
            <th>출석 상태</th>
        </tr>
        <tr>
            <td>1</td>
            <td>김학생</td>
            <td>HTML 기초</td>
            <td>출석</td>
        </tr>
        <tr>
            <td>2</td>
            <td>이학생</td>
            <td>CSS 기초</td>
            <td>지각</td>
        </tr>
        <tr>
            <td>3</td>
            <td>박학생</td>
            <td>화면 설계</td>
            <td>결석</td>
        </tr>
    </table>

</body>
</html>
