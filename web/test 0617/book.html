<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Document</title>

    <style>
        body {
            background-color: #eee;
            font-family: Arial, sans-serif;
        }

        .book {
            border: 2px solid black;
            background-color: white;
        }

        h1 {
            color: darkgreen;
            font-size: 30px;
        }

        .book-info {
            border: 1px solid gray;
            background-color: #f9f9f9;
        }
        .img {
            width: 30px;
            height: 30px;
        }
    </style>
</head>
<body>
    <h1>도서 상세 화면</h1>

    <div class="book">
        <img src="book.jpg" alt="도서">

        <div class="book-info">
            <h3>HTML 기초 입문</h3>
            <p>저자 : 김코딩</p>
            <p>출판사 : 웹북스</p>
            <p>대여 가능 여부 : 대여 가능</p>
        </div>

        <h2>도서 설명</h2>
        <p>
            이 책은 HTML을 처음 배우는 학습자를 위한 입문서입니다.<br>
            웹 페이지의 기본 구조와 다양한 태그 사용법을 쉽게 설명합니다.<br>
            이미지,링크,목록,표,입력 요소를 단계적으로 학습할 수 있습니다.
        </p>

        <div class="button-area">
            <input type="button" value="대여하기">
        </div>

        <p>
            <a href="book-list.html">목록으로 돌아가기</a>
        </p>

    </div>

</body>
</html>
