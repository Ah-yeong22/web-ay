<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 텍스트 서식을 표현할 수 있는 태그 -->
    <!-- b 태그 굵은 텍스트를 정의 -->
     <p><b>단락</b>을 구별하는<strong>태그</strong>는 p 태그이다</p>
     
     <i>텍스트 기울이기</i>
    <p>
     <em>텍스트 기울이기 2</em>
    </p>

    <!-- del : 취소선 -->
     my favoriate color is <del>balck</del> red

    <p>
    <!-- samll : 글씨 작게 -->
     HTML <small>Samll</small> Formatting
    </p>

    <!-- mark : 글씨 하이라이트 -->
     HTML <mark>Marked</mark> Formatting

     <p>
        <!-- sub : 글이 아래로 나온다. -->
         This is <sub>subscripted</sub> text
     </p>

        <!-- sup : 글이 위로 나온다 -->
         This is <sup>subscripted</sup> text
</body>
</html>
