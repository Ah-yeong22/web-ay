<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="box.css">

    <style>
        section{
            display: flex;
        }

         .o1{
            order: 1;
         }
          .o2{
            order: 2;
         }
          .o3{
            order: 3;
         }
          .o4{
            order: 4;
         }

         .box{
            flex-grow: 0;
         }

         .f1{
            flex-grow: 1;
         }
         .f2{
            flex-grow: 1;
         }
         .s1{
            flex-shrink:1 ;
         }

         .s2{
            flex-shrink:2 ;
         }
         .s3{
            flex-shrink:3 ;
         }
        .s4{
            flex-shrink:4 ;
         }
         .box{
            width: 400px;
         }
         .b1{
            flex-basis: 50px;
         }

         .b2{
            flex-basis: 100px;
         }
         .b3{
            flex-basis: 200px;
         }
         .b4{
            flex-basis: 300px;
         }

         section{
            height: 300px;
            align-items: center;
         }
         
          .a1{
            align-self: flex-start;
         }
         .a2{
            align-self: flex-end;
         }
         .a3{
            align-self: stretch;
         }
         .a4{
            align-self: center;
         }
    </style>
</head>
<body>
    <h2>기본 순서</h2>
    <section>
        <div class="box a">A</div>
        <div class="box b">B</div>
        <div class="box c">C</div>
        <div class="box d">D</div>
    </section>

    <h2>order를 통한 재배치</h2>
    <section>
        <div class="box a o2">A</div>
        <div class="box b o4">B</div>
        <div class="box c o1">C</div>
        <div class="box d o3">D</div>
    </section>

    <h2>flex-grow</h2>
    <section>
        <div class="box a f1">A</div>
        <div class="box b f2">B</div>
        <div class="box c f3">C</div>
        <div class="box d f4">D</div>
    </section>

    <h2>flex-shink</h2>
    <section>
        <div class="box a s1">A</div>
        <div class="box b s2">B</div>
        <div class="box c s3">C</div>
        <div class="box d s4">D</div>
    </section>

     <h2>flex-basis</h2>
    <section>
        <div class="box a b1">A</div>
        <div class="box b b2">B</div>
        <div class="box c b3">C</div>
        <div class="box d b4">D</div>
    </section>

    <h2>align-self</h2>
    <section>
        <div class="box a a1">A</div>
        <div class="box b a2">B</div>
        <div class="box c a3">C</div>
        <div class="box d a4">D</div>
    </section>
</body>
</html>
