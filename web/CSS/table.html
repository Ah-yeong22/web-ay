<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>사원 성과 관리</title>

<style>
    table{
        border-collapse: collapse;
        width: 600px;
    }

    th, td{
        border: 1px solid #ccc;
        padding: 10px;
        text-align: center;
    }

    /* 첫 번째 행(헤더) */
    tr:first-child{
        background-color: #2c3e50;
        color: #ffffff;
    }

    /* 헤더 제외 데이터 행 중 짝수 행 */
    tr:not(:first-child):not(:last-child):nth-child(even){
        background-color: #f8f9fa;
    }

    /* 헤더와 마지막 행 제외 hover */
    tr:not(:first-child):not(:last-child):hover{
        background-color: #ebf5fb;
        cursor: pointer;
    }

    /* 마지막 행(총합) */
    tr:last-child{
        background-color: #eaeded;
        color: #2c3e50;
        font-weight: bold;
    }
</style>

</head>
<body>

<table>
    <tr>
        <th>사원 번호</th>
        <th>이름</th>
        <th>직급</th>
        <th>성과 점수</th>
    </tr>

    <tr>
        <td>A001</td>
        <td>김철수</td>
        <td>팀장</td>
        <td>95점</td>
    </tr>

    <tr>
        <td>A002</td>
        <td>이영희</td>
        <td>대리</td>
        <td>88점</td>
    </tr>

    <tr>
        <td>A003</td>
        <td>박민수</td>
        <td>사원</td>
        <td>72점</td>
    </tr>

    <tr>
        <td>A004</td>
        <td>최지우</td>
        <td>사원</td>
        <td>84점</td>
    </tr>

    <tr>
        <td>총계</td>
        <td>4명</td>
        <td>-</td>
        <td>평균 84.75점</td>
    </tr>
</table>

</body>
</html>
