<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body{
            background: color #7f9fc7;
            padding: 20px;
        }

        .base-box{
            width: 200px;
            margin-bottom: 20px;
            background-color: #74b9ff;
            color: white;
            border: 2px solid #0984e3;
        }

    </style>

</head>
<body>
    <!-- padding
     테두리와 내용 사이의 여백 
     padding : 네 방향의 여백을 한번에 지정할 수 있다.
     padding : 10px 상,하,좌,우
     padding : 10px 20px 상하/좌우
     padding : 10px 20px 30px 상/좌우/하
     padding : 10px 20px 30px 40px 상 우 하 좌-->

    <h2>모든 방향에 대한 padding값 실습</h2>

    <div class="base-box">padding-top</div>
    <div class="base-box">padding-right</div>
    <div class="base-box">padding-left</div>
    <div class="base-box">padding-bottom</div>
    <div class="base-box">padding-all</div>

</body>
</html>
