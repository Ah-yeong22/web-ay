<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .page{
            width: 800px;
            container-type: inline-size;
            container-name: page;
            border: 1px solid black;
        }
        .card{
            padding: 20px;
            background-color: skyblue;
        }
        @container page (min-width :700px){
            .card{background-color: tomato;}
        }
        .sidebar{
            container-type: inline-size;
            container-name: sidebar;
        }
        @container page (min-width:800px) {
            .card{
                background-color: red;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="sidebar">
            <div class="card">
                카드
            </div>
        </div>
    </div>
</body>
</html>
