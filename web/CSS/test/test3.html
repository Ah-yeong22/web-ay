<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC 소프트웨어</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:#e9e9e9;
            font-family:맑은 고딕, sans-serif;
        }

        .container{
            width:1100px;
            margin:0 auto;
        }

        /* 헤더 */
        .header{
            background:#22313b;
            color:white;
            padding:50px 20px;
            margin-bottom:15px;
        }

        .header h1{
            margin-bottom:25px;
            font-size:40px;
        }

        .header p{
            font-size:22px;
        }

        /* 본문 */
        .content{
            display:grid;
            grid-template-columns:180px 1fr 220px;
            gap:15px;
        }

        /* 왼쪽 메뉴 */
        .menu{
            background:#f5f5f5;
            border:1px solid #d0d0d0;
            padding:20px;
        }

        .menu div{
            background:#e6e6e6;
            padding:20px 10px;
            margin-bottom:15px;
            border-radius:5px;
            font-size:20px;
        }

        /* 가운데 */
        .main{
            background:white;
            border:1px solid #d0d0d0;
            padding:20px;
        }

        .main h2{
            font-size:45px;
            margin-bottom:25px;
        }

        .main p{
            font-size:25px;
            line-height:1.8;
            margin-bottom:35px;
        }

        /* 오른쪽 */
        .customer{
            background:#f4edd7;
            border:1px solid #d0d0d0;
            padding:20px;
        }

        .customer h2{
            font-size:30px;
            margin-bottom:30px;
        }

        .customer p{
            font-size:20px;
            margin-bottom:20px;
        }

        /* 푸터 */
        .footer{
            margin-top:15px;
            text-align:center;
            padding:25px;
            background:white;
            border:1px solid #d0d0d0;
            color:#555;
            font-size:18px;
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="header">
            <h1>ABC 소프트웨어</h1>
            <p>기업용 웹 시스템을 개발하는 IT 회사입니다.</p>
        </div>

        <div class="content">

            <div class="menu">
                <div>회사소개</div>
                <div>서비스</div>
                <div>채용정보</div>
                <div>문의하기</div>
            </div>

            <div class="main">
                <h2>회사 소개</h2>
                <p>
                    ABC 소프트웨어는 학원, 병원, 쇼핑몰을 위한 웹 기반 관리 시스템을
                    개발합니다. 사용자가 쉽고 빠르게 업무를 처리할 수 있는 서비스를
                    제공합니다.
                </p>

                <h2>주요 서비스</h2>
                <p>
                    예약 관리, 회원 관리, 결제 관리, 통계 대시보드 기능을 제공합니다.
                </p>
            </div>

            <div class="customer">
                <h2>고객센터</h2>
                <p>전화: 02-1234-5678</p>
                <p>운영시간: 09:00 ~ 18:00</p>
            </div>

        </div>

        <div class="footer">
            Copyright 2026 ABC Software
        </div>

    </div>

</body>
</html>
