<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 150px;
            height: 100px;
            background-color: red;
            color: white;
            font-size: 24px;
            text-align: center;
            margin-bottom: 20px;
            line-height: 100px;
        }
        .box1{
            opacity: 1;
        }
        .box2{
            opacity: 0.5;
        }
        .box3{
            opacity: 0.1;
            transition: opacity 0.5s;
        }
        .card{
            border: 1px solid black;
            width: 200px;
            opacity: 0.3;
        }
        .card:hover{ 
            opacity: 1;
            
        }
    </style>
</head>
<body>
    <div class="box box1">1</div>
    <div class="box box2">0.5</div>
    <div class="box box3">0.1</div>
    <hr>
    <div class="card">
        <h2>제목</h2>
        <p>내용</p>
    </div>
</body>
</body>
</html>
