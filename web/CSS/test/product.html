<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body{
            background-color: #f2f2f2;
        }
        .product{
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 10px;
        }
        .product-item{
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 20px;
        }

        .bag{
            width: 100%;
            height: 30px;
            align-items: center;
            background-color: black;
            border: 1px solid black;
            color: white;
            border-radius: 4px;
            font-size: 14px;
            justify-content: center;
        }
         .button-group{
            display: flex;
            justify-content: center;
            gap: 10px;
            margin:10px 10px;
         }
         h2{
            font-size: 28px;
         }
         .text{
            color: #ccc;
         }
    </style>
</head>
<body>
    <h2>오늘의 추천 상품</h2>
    <div class="product">
        <div class="product-item">
            <h4>무선 마우스</h4>
            <p class="text">가볍고 조용한 사무용 마우스</p>
            <p><b >29,900원</b></p>
            <div class="button-group">
            <button type="submit" class="bag">장바구니</button>
        </div>
        </div>
        <div class="product-item">
            <h4>기계식 키보드</h4>
            <p class="text">타건감이 좋은 입문용 키보드</p>
            <p><b>79,000원</b></p>
            <div class="button-group">
            <button type="submit" class="bag">장바구니</button>
            </div>
        </div>

        <div class="product-item">
            <h4 >노트북 거치대</h4>
            <p class="text">자세 교정에 좋은 알루미늄 거치대</p>
            <p><b>35,000원</b></p>
            <div class="button-group">
            <button type="submit" class="bag">장바구니</button>
            </div>
        </div>

        <div class="product-item">
            <h4 >USB 허브</h4>
            <p class="text">노트북 확장에 필요한 5포트 허브</p>
            <p><b>22,000원</b></p>
            <div class="button-group">
            <button type="submit" class="bag">장바구니</button>
            </div></div>
        <div class="product-item">
            <h4>웹캠</h4>
            <p class="text">온라인 수업과 회의에 적합한 웹캠</p>
            <p><b>45,000원</b></p>
            <div class="button-group">
            <button type="submit" class="bag">장바구니</button>
            </div></div>
        <div class="product-item">
            <h4 >모니터 받침대</h4>
            <p class="text">책상을 깔끔하게 정리할 수 있는 받침대</p>
            <p><b>18,000원</b></p>
            <div class="button-group">
            <button type="submit" class="bag">장바구니</button>
            </div></div>
    </div>
</body>
</html>
