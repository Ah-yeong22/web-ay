<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body{
            background-color: #f1f3f5;
        }
        .owner{
            display: grid;
            grid-template-columns: 400px 400px;
            grid-template-rows: 150px 150px;
            gap: 20px;
        }
        .owner-item{
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 20px;
        }
        .detail{
            font-size: 40px;
            font-weight: bold;
            margin-top: 10px;
        }
        h2{
            font-size: 30px;
        }
    </style>
</head>
<body>
    <h2>관리자 대시보드</h2>
    <div class="owner">
        <div class="owner-item">
            <p><b>전체 수강생</b></p>
            <p class="detail">128명</p>
        </div>

        <div class="owner-item">
            <p><b>오늘 출석률</b></p>
            <p class="detail">92%</p>
        </div>

        <div class="owner-item">
            <p><b>미납 수강생</b></p>
            <p class="detail">7명</p>
        </div>

        <div class="owner-item">
            <p><b>상담 예약</b></p>
            <p class="detail">12건</p>
        </div>
    </div>
</body>
</html>
