<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 200px;
            height: 200px;
            background-color: seagreen;
            margin-bottom: 20px;
            color: white;
            text-align: center;
        }
        .hidden{
            visibility: hidden;
        }
    </style>
</head>
<body>
    <div class="box">1</div>
    <div class="box hidden">2</div>
    <div class="box">3</div>
</body>
</html>
