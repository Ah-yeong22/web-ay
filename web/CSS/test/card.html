<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상품 카드</title>

<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body{
        background: #f5f6fa;
        padding: 30px;
    }

    .container{
        display: flex;
        gap: 20px;
        justify-content: center;
        flex-wrap: wrap;
    }

    .card{
        width: 300px;
        background: white;
        border-radius: 12px;
        overflow: hidden; /* 이미지가 카드 밖으로 나가지 않게 */
        box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        transition: 0.3s;
    }

    .image-box{
        overflow: hidden;
    }

    .image-box img{
        width: 100%;
        display: block;
        transition: 0.4s;
    }

    .content{
        padding: 20px;
    }

    .content h2{
        margin-bottom: 10px;
    }

    .content p{
        margin-bottom: 15px;
    }

    button{
        padding: 10px;
        border: none;
        background: black;
        color: white;
        border-radius: 6px;
        cursor: pointer;
        transition: 0.3s;
    }

    /* Hover 효과 */
    .card:hover{
        transform: translateY(-10px);
        box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .card:hover img{
        transform: scale(1.08);
    }

    .card:hover button{
        background: blue;
    }
</style>
</head>
<body>

<div class="container">

    <div class="card">
        <div class="image-box">
            <img src="https://picsum.photos/300/200?1" alt="상품1">
        </div>
        <div class="content">
            <h2>프리미엄 상품</h2>
            <p>마우스를 올리면 카드와 이미지가 부드럽게 움직입니다.</p>
            <button>구매하기</button>
        </div>
    </div>

</div>

</body>
</html>
