<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>반응형 블로그</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f5f5f5;
}

.container{
    max-width:1200px;
    margin:0 auto;
}

header{
    background:#333;
    color:white;
    text-align:center;
    padding:20px;
}

nav{
    background:#444;
}

nav ul{
    list-style:none;
    display:flex;
}

nav li{
    flex:1;
}

nav a{
    display:block;
    text-decoration:none;
    color:white;
    text-align:center;
    padding:15px;
}

.layout{
    display:flex;
    gap:20px;
    padding:20px;
}

main{
    flex:1;
}

.posts{
    display:flex;
    gap:20px;
}

.card{
    flex:1;
    background:white;
    border:1px solid #ddd;
    border-radius:10px;
    overflow:hidden;
}

.thumb{
    width:100%;
    aspect-ratio:16/9;
    object-fit:cover;
    display:block;
}

.content{
    padding:15px;
}

.title{
    font-size:22px;
    margin-bottom:10px;
}

.meta{
    color:gray;
    margin-bottom:10px;
}

aside{
    width:260px;
    background:white;
    border:1px solid #ddd;
    border-radius:10px;
    padding:20px;
}

aside ul{
    padding-left:20px;
    margin-top:10px;
}

footer{
    background:#333;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:20px;
}
</style>
</head>
<body>

<div class="container">

    <header>
        <h1>My Blog</h1>
    </header>

    <nav>
        <ul>
            <li><a href="#">홈</a></li>
            <li><a href="#">카테고리</a></li>
            <li><a href="#">태그</a></li>
            <li><a href="#">정보</a></li>
        </ul>
    </nav>

    <div class="layout">

        <main>
            <section class="posts">

                <article class="card">
                    <img class="thumb" src="https://picsum.photos/800/450?1" alt="자연 풍경 썸네일">
                    <div class="content">
                        <h3 class="title">포스트 제목 1</h3>
                        <p class="meta">2025-06-24 · 여행</p>
                        <p>간단한 소개 문장</p>
                    </div>   
                </article>

                <article class="card">
                    <img class="thumb" src="https://picsum.photos/800/450?2" alt="노트북 작업 썸네일">
                    <div class="content">
                        <h3 class="title">포스트 제목 2</h3>
                        <p class="meta">2025-06-24 · 개발</p>
                        <p>간단한 소개 문장</p>
                    </div>
                </article>

                <article class="card">
                    <img class="thumb" src="https://picsum.photos/800/450?3" alt="카페 분위기 썸네일">
                    <div class="content">
                        <h3 class="title">포스트 제목 3</h3>
                        <p class="meta">2025-06-24 · 일상</p>
                        <p>간단한 소개 문장</p>
                    </div>
                </article>

            </section>
        </main>

        <aside>
            <h4>사이드바</h4>
            <ul>
                <li>인기 글</li>
                <li>최근 댓글</li>
                <li>카테고리</li>
            </ul>
        </aside>

    </div>

    <footer>
        <small>© 2025 My Blog. All rights reserved.</small>
    </footer>

</div>

</body>
</html>
