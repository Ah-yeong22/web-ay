<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .card{
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin: 10px;
        }
        .card.success{
            border: 1px solid #2ecc71;
            background-color: #e8f8f5;
        }
        .card.danger{
            border: 1px solid #e74c3c;
            background-color: #fdedec;
        }
        .card.danger.critical{
            background-color: #c0392b;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <h1>문제 1번</h1>
    <div class="card success">성공 메시지</div>
    <div class="card danger critical">매우 심각한 오류 메시지</div>
</body>
</html>
