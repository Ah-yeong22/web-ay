<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>추천 상품</title>

    <style>
        *{
            box-sizing: border-box;
        }

        body{
            background-color: #f5f6fa;
            margin: 20px;
        }

        .product-list{
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card{
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px;

            /* 컨테이너 쿼리 사용 */
            container-type: inline-size;
        }

        /* 미디어 쿼리 */
        @media (min-width: 768px){
            .product-list{
                flex-direction: row;
            }

            .card{
                flex: 1;
            }
        }

        /* 컨테이너 쿼리 */
        @container (min-width: 300px){
            .card{
                background-color: #fff7ed;
            }

            .card h2{
                font-size: 2rem;
            }

            .card p,
            .card strong{
                font-size: 1.2rem;
            }

            .card button{
                width: 100%;
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

    <section class="product-list">

        <section class="card">
            <h2>무선 키보드</h2>
            <p>조용한 타건감과 긴 배터리 시간을 제공하는 키보드입니다.</p>
            <strong>39,000원</strong><br><br>
            <button>구매하기</button>
        </section>

        <section class="card">
            <h2>무선 마우스</h2>
            <p>가볍고 휴대하기 좋은 사무용 무선 마우스입니다.</p>
            <strong>25,000원</strong><br><br>
            <button>구매하기</button>
        </section>

        <section class="card">
            <h2>USB 허브</h2>
            <p>노트북에 다양한 장치를 연결할 수 있는 멀티 허브입니다.</p>
            <strong>32,000원</strong><br><br>
            <button>구매하기</button>
        </section>

    </section>

</body>
</html>
