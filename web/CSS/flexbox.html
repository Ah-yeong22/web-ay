    <style>
        .flex{
            display: flex;
        }

        .row{
            display: flex;
            flex-direction: row;
        }

        .rowReverse{
            display: flex;
            flex-direction: row-reverse;
        }

        .column{
            display: flex;
            flex-direction: column;
        }

        .wrap{

        .flex-end{

        .flex-center{

        }
        .space-between{

            justify-content: space-between;
        }

        .space-around{
            display: flex;
            justify-content: space-around;
        }

        .stretch{
            display: flex;
            align-items: stretch;
        }
    </style>
</head>
