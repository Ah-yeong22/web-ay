<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        html{
            font-size: 16px;
        }

        div{
            background-color: #74b9ff;
            color: white;
            padding: 10px;
            margin-bottom: 10px;
        }
        .box-px{
            width: 200px;
        }
        
        .box-em{
            width: 10em;
        }
    </style>
</head>
<body>
    <div class="box-px">width : 200px</div>
    <div class="box-em">width : 200em</div>
    <div class="box-rem">width : 200rem</div>
    <div class="box-percent">width : 200%</div>
</body>
</html>
