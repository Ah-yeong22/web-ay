<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>유저 카드</title>

<style>
    .user-list{
        width: 500px;
        margin: 20px auto;
    }

    /* 기본 카드 스타일 */
    .card{
        background-color: #f8f9fa;
        border: 1px solid #dee2e6;
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 15px;
    }

    /* 첫 번째 카드 */
    .card:first-child{
        border: 2px solid #3498db;
    }

    /* 두 번째 카드 */
    .card:nth-child(2){
        background-color: #fffcf0;
    }

    /* 역할 배지 기본 스타일 */
    .role-badge{
        font-size: 14px;
        padding: 4px 8px;
        border-radius: 4px;
        color: white;
        display: inline-block;
        margin-bottom: 10px;
    }

    /* 관리자 배지 */
    .role-badge.admin{
        background-color: #e74c3c;
    }

    /* 일반 회원 배지 */
    .role-badge.member{
        background-color: #2ecc71;
    }

    /* 카드 hover */
    .card:hover{
        background-color: #e9ecef;
        cursor: pointer;
    }

    /* 체크박스 선택 시 바로 뒤 라벨 스타일 */
    input[type="checkbox"]:checked + label{
        color: #9b59b6;
        font-weight: bold;
    }
</style>

</head>
<body>

<div class="user-list">

    <div class="card">
        <h3 class="user-name">홍길동 대리</h3>
        <span class="role-badge admin">관리자</span>
        <br><br>
        <input type="checkbox" id="user1">
        <label for="user1">현재 작업 멤버로 선택</label>
    </div>

    <div class="card">
        <h3 class="user-name">이영희 사원</h3>
        <span class="role-badge member">일반 회원</span>
        <br><br>
        <input type="checkbox" id="user2">
        <label for="user2">현재 작업 멤버로 선택</label>
    </div>

    <div class="card">
        <h3 class="user-name">김철수 사원</h3>
        <span class="role-badge member">일반 회원</span>
        <br><br>
        <input type="checkbox" id="user3">
        <label for="user3">현재 작업 멤버로 선택</label>
    </div>

</div>

</body>
</html>
