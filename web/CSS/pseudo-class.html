<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .h-btn{
            background-color: skyblue;
            padding: 10px 20px;
            margin-bottom: 10px;

        }

        .h-btn:hover{
            background-color: orange;
        }
        .h-btn:active{
            background-color: red;
        }
        input{
            border: 2px solid gray;
            padding: 10px;
            outline: none;
        }

        input:focus{
            border: 2px solid blue;
        }
        a:link{
            color: #3498db;
        }
        a:visited{
            color: red;
        }
        input:checked+label{
            color: #2ecc71;
            font-weight: bold;
        }
        input:enabled{
            background-color: #ecf0f1;
        }
        input:disabled{
            background-color: #bdc3c7;
        }
        input:required{
            border: 2px solid orange;
        }
        input:invalid{
            outline: none;
            border-color: red;
        }
        input:valid{
            border-color: green;
        }
        ul li:first-child{
            font-weight: bold;
            color: #2980b9;
        }

        ul li:last-child{
            font-weight: bold;
            color: red;
        }
        ul li:nth-child(3){
            font-weight: bold;
            color: green
            
            ;
        }
        p:first-of-type{
            color: #15a085;
            font-weight: bold;
        }
        /* p:last-of-type{
            color: tan;
            font-weight: bold;
        } */
        p:nth-of-type(3){
            color: tomato;
            font-weight: bold;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h2>동적 의사 클래스</h2>
    <button class="h-btn">버튼</button>
    <br>
    <input type="text" placeholder="이름 입력">
    <br><br>
    <a href="https://www.naver.com/">Example 링크</a>

    <hr>
    <h2>상태 의사 클래스</h2>
    <input type="checkbox" id="chk1">
    <label for="chk1">동의합니다.</label>
    <br><br>
    <input type="text" placeholder="입력 가능">
    <br><br>
    <input type="text" disabled placeholder="입력 불가능">
    <br><br>
    <input type="text" required placeholder="필수 사항">
    <br><br>
    <input type="email" required placeholder="이메일">
    <hr>
    <h2>구조 의사 클래스</h2>
    <ul>
        <li>첫 번재 항목</li>
        <li>두 번재 항목</li>
        <li>세 번재 항목</li>
        <li>네 번재 항목</li>
        <li>다섯 번재 항목</li>
    </ul>

    <p>첫 번째 문단</p>
    <p>두 번째 문단</p>
    <p>세 번째 문단</p>
    <p>네 번째 문단</p>
    <div>이것은 div 문단</div>
    <hr>
    <h2>기타 의사 클래스</h2>
    <p>이 문장은 기본 스타일입니다.</p>
    <p class="highlight">이 문장은 강조 문장입니다.</p>
    <p lang="en">This is English sentence</p>
</body>
</html>
